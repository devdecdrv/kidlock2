name: Build & Release APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle wrapper
        run: |
          mkdir -p app/gradle/wrapper
          curl -o app/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew
          curl -o app/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x app/gradlew
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > app/gradle/wrapper/gradle-wrapper.properties

      - name: Write settings.gradle
        run: |
          printf 'rootProject.name = "kidlock"\ninclude ":app"\n' > app/settings.gradle

      - name: Write project build.gradle
        run: |
          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:8.2.0"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n' > app/build.gradle

      - name: Create app module build.gradle
        run: |
          mkdir -p app/app
          printf 'apply plugin: "com.android.application"\napply plugin: "kotlin-android"\n\nandroid {\n    namespace "com.kidlock"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.kidlock"\n        minSdk 26\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n    kotlinOptions {\n        jvmTarget = "1.8"\n    }\n    sourceSets {\n        main {\n            manifest.srcFile "src/main/AndroidManifest.xml"\n            java.srcDirs = ["src/main/kotlin"]\n            res.srcDirs = ["src/main/res"]\n        }\n    }\n}\n\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n    implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/app/build.gradle

      - name: Move source files
        run: |
          mkdir -p app/app/src/main/kotlin/com/kidlock
          mkdir -p app/app/src/main/res/xml
          mkdir -p app/app/src/main/res/layout
          if [ -d app/src ]; then
            cp -r app/src/. app/app/src/ 2>/dev/null || true
          fi
          if [ -d src ]; then
            cp -r src/. app/app/src/ 2>/dev/null || true
          fi

      - name: Show final structure
        run: find app -type f | sort

      - name: Build Release APK
        run: |
          cd app
          ./gradlew assembleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KidLock ${{ steps.version.outputs.tag }}
          files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          body: Auto release on push to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
